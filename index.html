<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 見る端末やOSの設定に関係なく、いつもダークで表示します */
:root{
  color-scheme: dark;
  --ground:#0E1312; --surface:#161D1B; --surface-2:#1D2523; --weekend:#121817;
  --line:#3E4C48; --line-strong:#647672; --ink:#E7EDEA; --muted:#D1D9D5;   /* 白の75%。真っ白より一段だけ落とす */
  --accent:#48BFA6; --accent-ink:#08201C; --accent-soft:#11332C;
  /* 本日の丸。色はどれも別の意味（製造・出荷・他予定・期限・完了）に
     割り当ててあるので、本日は色を持たせず「白い丸」という形だけで示します */
  --today-bg:#FFFFFF; --today-ink:#131A18;
  --warn:#D9A445; --warn-soft:#30260F; --danger:#E4695C; --danger-soft:#391C19;
  --off-ink:#A85F57; --ago-ink:#8CBBD4;
  /* 曜日の見出しと日付の数字。日曜は明るい赤と濃い赤、土曜は明るい青と濃い青 */
  --sat:#5DB1E5; --sat-ink:#5C8EAD;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
  --radius:8px;
}
*{box-sizing:border-box}
/* hidden 属性を確実に効かせる（クラス側の display 指定に負けないようにする） */
[hidden]{display:none !important;}

/* 製造＝コバルト（青）、出荷＝レモン（黄）で見分ける。
   Googleカレンダーの色名に合わせています */
:root{--mfg:#7FAAF2; --mfg-ink:#0B1F44; --mfg-soft:#16294A;
      --ship:#F2D64B; --ship-ink:#3A2E00; --ship-soft:#3B3512;
      /* ほかの業務（Googleカレンダーの参考表示）＝ライラック */
      --misc:#D0C7F4; --misc-ink:#221A47; --misc-soft:#2E2752;}
.kind{display:inline-block; font-size:.6em; font-weight:700; padding:2px 7px; border-radius:4px;
  margin-right:8px; vertical-align:middle; letter-spacing:.04em;
  background:var(--mfg); color:var(--mfg-ink);}
.kind.k-s{background:var(--ship); color:var(--ship-ink);}
.task.k-s .task-card{border-left:3px solid var(--ship);}
.task.k-m .task-card{border-left:3px solid var(--mfg);}
.c-item.k-s{background:var(--ship-soft); border-left-color:var(--ship);}
/* ほかの業務。読むだけなので押せません */
.c-item.misc{background:var(--misc-soft); border-left-color:var(--misc); color:var(--misc);}
html,body{height:100%;}
@supports (height: 100dvh){ html,body{height:100dvh;} }
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;                /* 画面の外にはみ出させない */
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;}
.wrap{max-width:1100px; margin:0 auto; padding:12px 12px 10px;
  height:100%; display:flex; flex-direction:column; min-height:0;}
/* 月表示だけ横幅いっぱいに広げます。
   日表示はカードを読む画面なので、横に伸びすぎないよう今の幅のままです */
body.month .wrap{max-width:none}

/* 月表示は画面ぴったり。日表示だけ中身をスクロールさせます */
#app{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}
#app.view-month{overflow:hidden;}
#app.view-day{overflow-y:auto; -webkit-overflow-scrolling:touch;}
#boot{flex:none}

/* 前回の内容を表示している間は、触れないようにして誤操作を防ぎます */
body.stale #app{opacity:.55; pointer-events:none; filter:saturate(.7);}

/* ---- 共通バー ---- */
.bar-top{display:flex; align-items:center; gap:10px; margin-bottom:10px; min-height:36px; flex:none;}
.bar-top h1{font-size:19px; font-weight:700; margin:0; flex:1;}
.bar-top h1 small{display:block; font-size:11px; font-weight:500; letter-spacing:.12em; color:var(--muted);}
.state{font-size:11.5px; color:var(--muted); white-space:nowrap;}
.state.busy{color:var(--accent)} .state.err{color:var(--danger)}
button{
  font-family:inherit; font-size:14px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:6px; padding:8px 14px; cursor:pointer;
  line-height:1.4; min-height:40px;
}
button:hover{background:var(--surface-2)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
button.icon{padding:8px 12px; font-size:17px; min-width:42px;}
button.ghost{background:transparent; border-color:transparent; color:var(--accent); font-weight:500;}
/* ほかの業務の表示切り替え。押している状態が分かるようにします */
button.misc-btn{border-color:var(--misc); color:var(--misc); background:transparent;}
button.misc-btn.on{background:var(--misc); color:var(--misc-ink); font-weight:700;}

/* ---- 月表示 ---- */
.nav{display:flex; align-items:center; gap:6px; margin-bottom:8px; flex:none;}
.nav .label{font-size:18px; font-weight:700; min-width:132px; text-align:center;}
.nav .sp{flex:1}

.cal{background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius); overflow:hidden;
  flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}

/* 土日は幅を狭める（作業がほぼ入らないため） */
.dow, .grid{display:grid; grid-template-columns:0.62fr repeat(5, 1fr) 0.62fr;}
.dow{background:var(--surface-2); border-bottom:1px solid var(--line-strong); flex:none;}
.dow div{padding:6px 4px; font-size:11.5px; font-weight:600; letter-spacing:.08em; color:var(--muted); text-align:center; min-width:0;}
.dow .sun{color:var(--danger)} .dow .sat{color:var(--sat)}

/* 残りの高さを行数で割り切る。スクロールは出しません（スマホ） */
.grid{flex:1 1 auto; min-height:0; grid-auto-rows:minmax(0, 1fr);}

.cell{
  border-right:1px solid var(--line-strong); border-bottom:1px solid var(--line-strong);
  padding:6px 5px; text-align:left;
  background:var(--surface); font:inherit; color:inherit; cursor:pointer;
  display:flex; flex-direction:column; gap:3px; align-items:stretch;
  min-width:0; overflow:hidden;
}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--accent-soft)}
.cell.off{background:var(--weekend)}
/* 当月以外（同じ行に入る前月末・翌月頭）は薄く見せる */
.cell.other{background:var(--ground);}
/* 当月以外は日付の数字だけ薄くします。
   案件まで薄くすると、同じ「済」でも月をまたいだ側だけ暗く見えてしまうため */
.cell.other .c-num{opacity:.75}
/* 本日は日付を丸（1日は「9/1」なので角丸の帯）で囲みます */
.cell.empty{cursor:default}
.cell.empty:hover{background:var(--surface)}
.cell.empty.off:hover{background:var(--weekend)}
.c-head{display:flex; align-items:center; justify-content:space-between; gap:4px;}
.c-num{font-size:15px; font-weight:600; white-space:nowrap; line-height:1.5;}
.cell.today .c-num{
  background:var(--today-bg); color:var(--today-ink); font-weight:700;
  border-radius:999px; padding:0 7px; min-width:1.6em; line-height:1.5;
  display:inline-flex; align-items:center; justify-content:center;
}
/* 休みの日の数字。土曜だけは見出しの「土」に合わせて青にします（7列ぶんの最後が土曜）。
   本日の白い丸の中は、丸の中の文字色をそのまま使います */
.cell.off:not(.today) .c-num{color:var(--off-ink); font-weight:700;}
.cell.off:nth-child(7n):not(.today) .c-num{color:var(--sat-ink)}
.c-count{font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px;
  background:var(--accent); color:var(--accent-ink); white-space:nowrap; flex:none;}
.c-count.all-done{background:var(--surface-2); color:var(--muted);}
.c-list{display:flex; flex-direction:column; gap:3px; min-height:0; overflow:hidden;}
.c-item{
  flex:none;
  font-size:11.5px; line-height:1.35; padding:2px 4px; border-radius:3px;
  border-left:3px solid var(--mfg);
  background:var(--mfg-soft); color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.c-item.done{background:var(--surface-2); color:var(--muted); text-decoration:line-through;}
.c-more{font-size:10.5px; color:var(--muted); padding-left:3px;}

/* PCは、その日のタスクが全部見えるようにマスを縦に伸ばします。
   画面に入りきらないぶんはカレンダーの中を縦スクロールします。
   スマホは1画面に収める今の形のままです（マスが伸びると押しづらいため） */
@media (min-width:761px){
  .cal{overflow-y:auto; overflow-x:hidden;}
  .grid{flex:0 0 auto; min-height:100%; grid-auto-rows:minmax(118px, auto);}
  .dow{position:sticky; top:0; z-index:2;}
  .cell{overflow:visible}
  .c-list{overflow:visible; min-height:auto;}
}

/* ---- 日表示 ---- */
.day-head{display:flex; align-items:baseline; gap:12px; margin-bottom:4px;}
.day-head .d{font-size:26px; font-weight:700; letter-spacing:.01em;}
.day-head .w{font-size:14px; color:var(--ink);}
.counts{font-size:13px; color:var(--ink); margin:0 0 14px;}
.counts b{color:var(--ink); font-size:15px;}
.hint{
  display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted);
  background:var(--surface); border:1px solid var(--line-strong);
  border-radius:6px; padding:9px 12px; margin-bottom:12px; line-height:1.45;
}
/* 左端に「未完了」。右の完了枠と対になるようにしています */
.hint .lab{color:var(--ink); font-weight:700; white-space:nowrap; flex:none;}
.hint .arrow{color:var(--accent); font-weight:700; font-size:15px; letter-spacing:-.05em; flex:none;}
.hint .msg{flex:1 1 auto; min-width:0; color:var(--ink);}

.section-label{font-size:11px; letter-spacing:.12em; font-weight:600; color:var(--muted); margin:0 0 8px;}
.tasks{display:flex; flex-direction:column; gap:9px;}

/* 日表示：左＝作業するもの／右＝完了したもの */
.day-cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,320px); gap:14px; align-items:start;}
.col{min-width:0;}
.col-done{
  background:var(--surface-2); border:1px dashed var(--line-strong);
  border-radius:var(--radius); padding:10px 10px 12px;
}
.col-done .section-label{color:var(--accent)}
.col-done .empty-msg{background:transparent; border:0; padding:22px 8px; font-size:12.5px;}
@media (max-width:760px){
  .day-cols{grid-template-columns:minmax(0,1fr);}
}

.task{position:relative; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
.task-bg{
  position:absolute; inset:0; background:var(--accent); color:var(--accent-ink);
  display:flex; align-items:center; padding-left:22px; font-size:15px; font-weight:700; letter-spacing:.06em;
}
.task-card{
  position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; display:grid; gap:5px;
  touch-action:pan-y; user-select:none; cursor:grab;
  will-change:transform;
}
.task-card.snap{transition:transform .18s ease-out}
.task.busy .task-card{opacity:.6}
.t-row1{display:flex; align-items:baseline; gap:10px;}
/* タイトルは種別の色、本文は白。色で製造／出荷を見分けられるようにします */
.t-name{font-size:16px; font-weight:700; line-height:1.35; flex:1; color:var(--mfg);}
.task.k-s .t-name{color:var(--ship)}
.t-time{font-size:12px; font-weight:600; color:var(--accent); background:var(--accent-soft);
  padding:2px 8px; border-radius:4px; white-space:nowrap;}
.t-sub{font-size:13px; color:var(--ink); line-height:1.5;}
.t-meta{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--ink); margin-top:2px;}
.t-meta .due{font-family:"IBM Plex Mono",monospace; font-weight:600;}
.t-meta .due.near{color:var(--warn)}
.t-meta .due.over{color:var(--danger)}
/* 完了したものは「遅れ」ではなく、別の色で「何日前」を出します */
.t-meta .due.ago{color:var(--ago-ink); font-weight:700;}
.task.done .t-meta .due.ago{color:var(--ago-ink)}
.t-meta .code{font-family:"IBM Plex Mono",monospace;}
/* ラベルがまだ出ていない出荷タスクの注意書き */
.t-meta .nolabel{color:var(--warn); font-weight:700;}
/* 在庫：何をいくつ作るかの表示（読むだけ。押せません）。
   作らない指示が付いているものは赤で知らせます */
.t-skus{display:flex; flex-direction:column; gap:5px; margin-top:6px;
  border-top:1px dashed var(--line-strong); padding-top:7px;}
.t-sku{display:grid; gap:1px; font-size:12.5px; line-height:1.4;}
.t-sku .code{font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--ink);}
.t-sku .nm{color:var(--ink)}
.t-sku .qty{font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--ink); margin-left:6px;}
.t-sku .lab{color:var(--danger); font-weight:700; display:block;}
.t-sku.off .code, .t-sku.off .qty{color:var(--danger)}
.t-skus .note{font-size:12px; color:var(--warn)}

/* ほかの業務のカード。ボタンもスワイプも無い、読むだけのもの */
.task.misc .task-card{border-left:3px solid var(--misc); cursor:default;}
.task.misc .t-name{color:var(--misc)}
.task.misc .kind{background:var(--misc); color:var(--misc-ink);}
.task.misc .t-sub{color:var(--ink)}

.t-actions{display:flex; justify-content:flex-end; margin-top:4px;}
.t-actions button{font-size:13px; padding:6px 12px; min-height:34px;}

.task.done .task-card{background:var(--surface-2); border-color:var(--line);}
/* 完了ぶんは隣の塗りバッジで種別が分かるので、タイトルは白でいい */
.task.done .t-name{color:var(--ink); font-weight:600;}   /* 日表示では取り消し線を付けない */
.task.done .t-sub, .task.done .t-meta{color:var(--muted)}
.task.done{box-shadow:none}

.empty-msg{padding:40px 16px; text-align:center; color:var(--muted); font-size:14px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);}
.boot{padding:70px 20px; text-align:center; color:var(--muted);}

/* ---- 合言葉の入力 ---- */
.gate{padding:56px 16px; display:flex; justify-content:center;}
.gate form{
  width:100%; max-width:360px; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius);
  padding:26px 22px; display:flex; flex-direction:column; gap:12px;
  box-shadow:var(--shadow);
}
.gate h2{margin:0; font-size:19px; font-weight:700;}
.gate p{margin:0; font-size:13.5px; color:var(--muted); line-height:1.6;}
.gate input{
  font-family:inherit; font-size:17px; padding:13px 14px;
  border:1px solid var(--line-strong); border-radius:6px;
  background:var(--ground); color:var(--ink); width:100%;
}
.gate input:focus{outline:2px solid var(--accent); outline-offset:1px;}
.gate button{
  background:var(--accent); color:var(--accent-ink); border-color:var(--accent);
  font-weight:700; font-size:16px; min-height:48px;
}
.gate button:hover{background:var(--accent); filter:brightness(1.08);}
.gate-err{font-size:13px; color:var(--danger); min-height:1em;}
.err-box{margin-top:12px; padding:10px 14px; border-radius:6px; background:var(--danger-soft);
  color:var(--danger); font-size:13px;}

/* スマホ・タブレット：文字の大きさ。
   「1.5倍」から半分ぶん下げて、だいたいPC版と同じ大きさにしています。
   指を置く場所（ボタン）だけは押しやすさのため高さを残します */
@media (max-width:1000px){
  body{font-size:14px}
  .wrap{padding:10px 8px 10px}

  /* 月表示 */
  .cell{min-height:0; padding:6px 5px;}
  .c-num{font-size:14px}
  .c-count{font-size:10px; padding:1px 6px;}
  .c-item{font-size:11px; padding:2px 4px; line-height:1.35;}
  .c-more{font-size:10px}
  .dow div{font-size:11px; padding:5px 4px;}
  .bar-top{min-height:0; margin-bottom:6px;}
  .bar-top h1{font-size:16px}
  .bar-top h1 small{font-size:10px}
  .state{font-size:10.5px}
  .nav{margin-bottom:6px}
  .nav .label{font-size:16px; min-width:0; flex:1 1 auto; text-align:center;}
  .nav button{font-size:12.5px; min-height:42px; padding:8px 12px;}
  .nav button.icon{font-size:16px; min-width:42px; padding:8px 10px;}

  /* 日表示 */
  .day-head .d{font-size:24px}
  .day-head .w{font-size:13px}
  .counts{font-size:12.5px}
  .counts b{font-size:14px}
  .hint{font-size:12px; padding:8px 11px;}
  .section-label{font-size:11px}
  .t-name{font-size:15.5px; line-height:1.4;}
  .t-sub{font-size:12px}
  .t-meta{font-size:11.5px; gap:6px 13px;}
  .t-sku{font-size:12px}
  .t-time{font-size:11.5px; padding:4px 9px;}
  .task-card{padding:13px 14px; gap:6px;}
  .task-bg{font-size:14px}

  /* 押しやすさ（文字は小さくしても、指で押す高さは確保します） */
  button{font-size:14px; min-height:46px; padding:10px 15px;}
  button.icon{font-size:16.5px; min-width:46px;}
  .t-actions button{font-size:13px; min-height:44px;}
  .empty-msg{font-size:14px}
  .gate h2{font-size:19px}
  .gate p{font-size:14px}
  .gate input{font-size:17px; padding:12px 14px;}
  .gate button{font-size:16px; min-height:48px;}
}
/* スマホ縦持ち：幅が狭いので、枠まわりをもう一段小さくします */
@media (max-width:560px){
  /* 「…」に1文字ぶん取られるのがもったいないので、狭い画面では出しません */
  .c-item{text-overflow:clip}
  /* 案内文は読点で改行します。中途半端な位置で折り返すと読みにくいので */
  .hint .p1{display:block}
  .c-item{font-size:9.5px; padding:2px 3px; border-left-width:2px;}
  .c-more{font-size:9.5px}
  .c-num{font-size:13px}
  .c-count{font-size:9.5px; padding:1px 5px;}
  .cell{padding:5px 4px; justify-content:flex-start;}

  /* 月の切り替えを1行に収める */
  .nav{gap:4px}
  .nav .label{font-size:14px; white-space:nowrap;}
  .nav button{font-size:12px; min-height:40px; padding:6px 10px;}
  .nav button.icon{font-size:15px; min-width:36px; padding:6px 8px;}
  .bar-top h1{font-size:15px}
  .bar-top h1 small{font-size:9.5px}
  .state{font-size:10px}
  .dow div{font-size:10px; padding:5px 2px;}
}

@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate" hidden>
    <form id="gate-form" autocomplete="on">
      <h2>出荷作業 <span id="gate-build" style="font-size:11px;font-weight:500;color:var(--muted)"></span></h2>
      <p>合言葉を入力してください。<br>一度入力すると、次回からは自動で開きます。</p>
      <input type="password" id="gate-input" autocomplete="current-password" placeholder="合言葉">
      <button type="submit">開く</button>
      <div class="gate-err" id="gate-err"></div>
    </form>
  </div>
  <div id="boot" class="boot">読み込んでいます…</div>
  <div id="app" hidden></div>
</div>

<script src="config.js"></script>
<script>
(function(){
"use strict";

/* 画面右上に出る版数。ファイルを更新したらここを1つ上げます。
   表示されている数字で、新しいファイルが読み込まれているか確認できます。 */
const BUILD = "v68";

/* ================= 接続先 ================= */
/* ★ Apps Script の「ウェブアプリのURL」（/exec で終わるもの）をここに貼ってください。
      デプロイし直してURLが変わったら、ここも直します。 */
const API = window.SHUKKA_API || "";

/* パスワードは端末に保存します。このファイルには書きません。
   URLに ?k=... が付いていればそれを使い、成功したらURLから消します。 */
const STORE = "shukka_work_key";

/* URLから合言葉を消す。読み込み中だと無視されることがあるので何度か呼びます */
function stripUrl(){
  if (location.search.indexOf("k=") < 0) return;
  try { history.replaceState(null, "", location.pathname); } catch(e){}
}
/* 書き換えで消えない場合は、読み込み直して消します。
   合言葉が端末に保存できているときだけ実行します */
function stripUrlHard(){
  if (location.search.indexOf("k=") < 0) return;
  stripUrl();
  if (location.search.indexOf("k=") < 0) return;
  let saved = "";
  try { saved = localStorage.getItem(STORE) || ""; } catch(e){}
  if (saved) location.replace(location.pathname);
}
window.addEventListener("load", stripUrl);
setTimeout(stripUrl, 300);
setTimeout(stripUrlHard, 2500);

function loadKey(){
  const q = new URLSearchParams(location.search).get("k");
  if (q){
    try { localStorage.setItem(STORE, q); } catch(e){}
    stripUrl();
    return q;
  }
  try { return localStorage.getItem(STORE) || ""; } catch(e){ return ""; }
}
function saveKey(k){
  try { localStorage.setItem(STORE, k); } catch(e){}
  if (location.search.indexOf("k=") >= 0){
    try { history.replaceState(null, "", location.pathname); } catch(e){}
  }
}
function forgetKey(){
  try { localStorage.removeItem(STORE); } catch(e){}
  dropSnaps();
  try {
    document.body.classList.remove("stale");
    document.getElementById("app").hidden = true;
  } catch(e){}
}

let KEY = loadKey();

function call(api, params){
  const u = new URL(API);
  u.searchParams.set("api", api);
  u.searchParams.set("k", KEY);
  Object.keys(params || {}).forEach(function(n){
    if (params[n] !== undefined && params[n] !== null) u.searchParams.set(n, params[n]);
  });
  return fetch(u.toString(), {method:"GET", redirect:"follow"})
    .then(function(r){
      if (!r.ok) throw new Error("通信に失敗しました（" + r.status + "）");
      return r.json();
    })
    .then(function(j){
      if (j && j.error) throw new Error(j.error);
      return j;
    });
}


const p = s => { const a = s.split("-").map(Number); return new Date(a[0], a[1]-1, a[2]); };
const iso = dt => dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
const add = (s,n) => { const t = p(s); t.setDate(t.getDate()+n); return iso(t); };
const diff = (a,b) => Math.round((p(b) - p(a)) / 86400000);
const md = s => { const a = s.split("-"); return Number(a[1]) + "/" + Number(a[2]); };
const WD = ["日","月","火","水","木","金","土"];

/* 完了したものに出す「何日前」。赤い「遅れ」とは別の色で表示します */
const agoText = d => {
  if (!d) return "完了";
  const n = diff(d, TODAY);
  return n <= 0 ? (n === 0 ? "本日" : Math.abs(n) + "日後") : n + "日前";
};

/* 休みの日。会社の休日カレンダーが読めていればそれを使います */
let HOLIDAYS = {};
/* 土日は常に休み。会社の休日カレンダーに入っている日（祝日・臨時休業など）も休みにします。
   休日カレンダーに土日が登録されていなくても、土日はきちんと色が付きます */
const isOff = s => {
  const w = p(s).getDay();
  if (w === 0 || w === 6) return true;
  return !!HOLIDAYS[s];
};

let jobs = [];   /* サーバーからは tasks で来ます（製造・出荷の2種類） */
let misc = [];   /* ほかの業務。Googleカレンダーの参考表示（読むだけ） */

/* ほかの業務を出すかどうか。端末ごとに覚えます */
const MISC_KEY = "shukka_misc_on";
let MISC_ON = true;
try { MISC_ON = (localStorage.getItem(MISC_KEY) !== "0"); } catch(e){}
function setMiscOn(on){
  MISC_ON = !!on;
  try { localStorage.setItem(MISC_KEY, MISC_ON ? "1" : "0"); } catch(e){}
  render();
}
function miscOn(date){
  if (!MISC_ON) return [];
  return misc.filter(function(m){ return m.date === date; });
}
function miscTime(m){
  if (m.allDay || !m.from) return "終日";
  return m.from + (m.to ? "〜" + m.to : "");
}
let TODAY = null;
let view = null;          /* Date: 表示中の月 */
let openDate = null;      /* 'yyyy-MM-dd' or null（null なら月表示） */
let pending = 0;
let booted = false;

const app = document.getElementById("app");

/* ---------- 読み込み ---------- */
function ym(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }

let loading = false;

/* 前回の内容を控えておき、開いた直後にすぐ表示します。
   最新が届くまでは触れないようにしてあります（古い内容のまま完了を送らないため） */
function snapKey(){ return "shukka_work_snap_" + ym(view || new Date()); }

function saveSnap(b){
  try { localStorage.setItem(snapKey(), JSON.stringify(b)); } catch(e){}
}
function dropSnaps(){
  try {
    const del = [];
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k.indexOf("shukka_work_snap_") === 0) del.push(k);
    }
    del.forEach(function(k){ localStorage.removeItem(k); });
  } catch(e){}
}

function applyBoard(b){
  jobs = b.tasks || [];
  misc = b.misc || [];
  HOLIDAYS = {};
  (b.holidays || []).forEach(function(d){ HOLIDAYS[d] = true; });
  TODAY = b.today;
  if (!view) view = p(TODAY);
  booted = true;
  document.getElementById("gate").hidden = true;
  document.getElementById("boot").hidden = true;
  app.hidden = false;
  render();
}

function showSnapshot(){
  if (!KEY) return false;
  let b = null;
  try { b = JSON.parse(localStorage.getItem(snapKey()) || "null"); } catch(e){}
  if (!b || !b.tasks) return false;
  try {
    document.body.classList.add("stale");
    applyBoard(b);
    setState("前回の内容／最新を取得中…", "busy");
    return true;
  } catch(e){
    document.body.classList.remove("stale");
    return false;
  }
}

function load(silent){
  if (loading) return;              /* 読み込みが重なって表示が食い違うのを防ぐ */
  loading = true;
  if (!silent) setState(document.body.classList.contains("stale")
    ? "前回の内容／最新を取得中…" : "読み込み中…", "busy");
  call("work", {ym: view ? ym(view) : null})
    .then(function(b){
      loading = false;
      document.body.classList.remove("stale");
      saveKey(KEY);
      applyBoard(b);
      saveSnap(b);
      setState("最終更新 " + hm(), "");
    })
    .catch(function(e){
      loading = false;
      const msg = String(e && e.message || e);
      /* 合言葉そのものが違うときだけ入力画面に戻す */
      if (/合言葉が違います|割り付け担当者/.test(msg)){
        forgetKey();
        showGate(msg);
        return;
      }
      if (!booted){
        document.getElementById("gate").hidden = true;
        document.getElementById("boot").hidden = false;
        document.getElementById("boot").innerHTML =
          '読み込みに失敗しました<div class="err-box"></div>';
        document.querySelector("#boot .err-box").textContent = msg;
      }
      setState("読み込み失敗", "err");
    });
}

/* ---------- パスワード入力 ---------- */
function showGate(msg){
  document.getElementById("boot").hidden = true;
  app.hidden = true;
  const g = document.getElementById("gate");
  g.hidden = false;
  document.getElementById("gate-err").textContent = msg || "";
  const inp = document.getElementById("gate-input");
  inp.value = "";
  setTimeout(function(){ inp.focus(); }, 50);
}

document.getElementById("gate-form").addEventListener("submit", function(e){
  e.preventDefault();
  const v = document.getElementById("gate-input").value.trim();
  if (!v) return;
  KEY = v;
  document.getElementById("gate").hidden = true;
  document.getElementById("boot").hidden = false;
  document.getElementById("boot").textContent = "読み込んでいます…";
  load(false);
});

function start(){
  const gb = document.getElementById("gate-build");
  if (gb) gb.textContent = BUILD;
  if (!KEY){ showGate(); return; }
  showSnapshot();     // 前回の内容をすぐ出して、待ち時間を体感させない
  load(false);
}

function hm(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function setState(t, cls){
  const el = document.getElementById("state");
  if (!el) return;
  el.textContent = t + "　" + BUILD;
  el.className = "state" + (cls ? " " + cls : "");
}

/* ---------- 日付ごとの割り当て ---------- */
function jobsOn(date){
  return jobs.filter(j => {
    if (!j.start) return false;
    const end = add(j.start, j.days - 1);
    return j.start <= date && date <= end;
  }).sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;      // 未完了が先
    if (a.kind !== b.kind) return a.kind === 'm' ? -1 : 1;  // 製造 → 出荷
    return a.row - b.row;
  });
}

/* 窓の幅や画面の向きが変わると、1マスに出せる件数が変わるので描き直します */
let resizeTimer = 0;
let lastW = window.innerWidth;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    if (Math.abs(window.innerWidth - lastW) < 30) return;
    lastW = window.innerWidth;
    if (!openDate) render();
  }, 200);
});

/* ---------- 描画 ---------- */
function render(){
  const y = app.scrollTop;
  app.innerHTML = "";
  app.className = openDate ? "view-day" : "view-month";
  document.body.classList.toggle("month", !openDate);
  if (openDate) renderDay(); else renderMonth();
  app.scrollTop = openDate ? y : 0;
}

function renderMonth(){
  const bar = el('div', 'bar-top');
  bar.innerHTML = '<h1><small>出荷作業</small>予定カレンダー</h1><span class="state" id="state"></span>';
  app.appendChild(bar);

  const nav = el('div', 'nav');
  nav.innerHTML =
    '<button class="icon" id="prev" aria-label="前の月">‹</button>' +
    '<span class="label mono" id="mlabel"></span>' +
    '<button class="icon" id="next" aria-label="次の月">›</button>' +
    '<button id="tbtn">今日</button><span class="sp"></span>' +
    '<button type="button" class="misc-btn" id="mbtn"></button>' +
    '<button class="ghost" id="rel">更新</button>';
  app.appendChild(nav);
  nav.querySelector("#mlabel").textContent = view.getFullYear() + "年" + (view.getMonth()+1) + "月";
  nav.querySelector("#prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()-1, 1); render(); load(true); };
  nav.querySelector("#next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); render(); load(true); };
  nav.querySelector("#tbtn").onclick = () => { view = p(TODAY); render(); load(true); };
  nav.querySelector("#rel").onclick = () => load(false);
  const mb = nav.querySelector("#mbtn");
  mb.classList.toggle('on', MISC_ON);
  /* 押すとどうなるかを書きます。どちらも4文字なので幅は変わりません */
  mb.textContent = MISC_ON ? '他 隠す' : '他 表示';
  mb.title = MISC_ON ? '他予定を隠す' : '他予定を表示する';
  mb.onclick = () => setMiscOn(!MISC_ON);

  const cal = el('div', 'cal');
  const dow = el('div', 'dow');
  WD.forEach((d,i) => {
    const c = el('div', i === 0 ? 'sun' : (i === 6 ? 'sat' : ''));
    c.textContent = d;
    dow.appendChild(c);
  });
  cal.appendChild(dow);

  const grid = el('div', 'grid');
  const first = new Date(view.getFullYear(), view.getMonth(), 1);
  const gridStart = iso(new Date(first.getFullYear(), first.getMonth(), 1 - first.getDay()));
  const daysInMonth = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  /* 1日の曜日と日数から、必要な行数だけ出します（余分な行を作らない） */
  const ROWS = Math.ceil((first.getDay() + daysInMonth) / 7);
  /* 1マスに出す件数。残りは「+○件」。
     PCはマスが伸びるので多めに、スマホは1画面に収めるため4件までです */
  const MAXI = (window.innerWidth <= 760) ? 4 : 10;

  for (let i = 0; i < ROWS * 7; i++){
    const date = add(gridStart, i);
    const dt = p(date);
    const w = dt.getDay();
    const otherMonth = (dt.getMonth() !== view.getMonth());

    const list = jobsOn(date);
    const other = miscOn(date);
    const undone = list.filter(j => !j.done).length;

    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cell'
      + (isOff(date) ? ' off' : '')
      + (otherMonth ? ' other' : '')
      + (date === TODAY ? ' today' : '')
      + (list.length + other.length ? '' : ' empty');
    cell.dataset.date = date;
    if (!list.length && !other.length) cell.disabled = true;

    let html = '<div class="c-head"><span class="c-num mono">'
             + (dt.getDate() === 1 ? (dt.getMonth()+1) + '/1' : dt.getDate()) + '</span>';
    if (list.length){
      html += '<span class="c-count' + (undone ? '' : ' all-done') + '">'
            + (undone ? undone + '件' : '済') + '</span>';
    }
    html += '</div>';
    cell.innerHTML = html;

    const box = el('div', 'c-list');
    /* タスクを先に出して、ほかの業務は一番下に回します。
       これで出荷や製造が押し出されません */
    let shown = 0;
    list.slice(0, MAXI).forEach(j => {
      const it = el('div', 'c-item k-' + (j.kind || 'm') + (j.done ? ' done' : ''));
      /* 「製」「出」の字は入れません。狭いマスでは名前が消えてしまうためで、
         代わりに背景色と左の線で見分けます */
      it.textContent = j.name;
      it.title = (j.kind === 's' ? '出荷' : '製造') + '　' + j.name;
      box.appendChild(it);
      shown++;
    });
    other.slice(0, Math.max(0, MAXI - shown)).forEach(m => {
      const it = el('div', 'c-item misc');
      it.textContent = (m.from ? m.from + ' ' : '') + m.name;
      it.title = miscTime(m) + '　' + m.name;
      box.appendChild(it);
      shown++;
    });
    const rest = list.length + other.length - shown;
    if (rest > 0){
      const m = el('div', 'c-more');
      /* 「他予定」と読み間違えないように、あふれは + で示します */
      m.textContent = "+" + rest + "件";
      box.appendChild(m);
    }
    cell.appendChild(box);
    cell.onclick = () => { openDate = date; render(); };
    grid.appendChild(cell);
  }
  cal.appendChild(grid);
  app.appendChild(cal);
}

function renderDay(){
  const dt = p(openDate);
  const list = jobsOn(openDate);
  const undone = list.filter(j => !j.done);
  const done = list.filter(j => j.done);
  const other = miscOn(openDate);   /* 使う場所より前で宣言します */

  const bar = el('div', 'bar-top');
  bar.innerHTML = '<button class="ghost" id="back">‹ カレンダー</button><span class="sp" style="flex:1"></span><span class="state" id="state"></span>';
  app.appendChild(bar);
  bar.querySelector("#back").onclick = () => { openDate = null; render(); };

  const head = el('div', 'day-head');
  head.innerHTML = '<span class="d mono">' + (dt.getMonth()+1) + '月' + dt.getDate() + '日</span>'
    + '<span class="w">' + WD[dt.getDay()] + '曜日' + (openDate === TODAY ? '・本日' : '') + '</span>';
  app.appendChild(head);

  const counts = el('p', 'counts');
  counts.innerHTML = '未完了 <b>' + undone.length + '</b> 件　/　完了 <b>' + done.length + '</b> 件';
  app.appendChild(counts);

  if (!list.length && !other.length){
    const e = el('div', 'empty-msg');
    e.textContent = 'この日の予定はありません。';
    app.appendChild(e);
    /* 他予定を隠しているだけの日もここに来ます。
       表示に戻すボタンまで消えてしまわないよう、下のボタンは必ず出します */
    app.appendChild(miscSection(other));
    return;
  }

  /* タスクが1件も無い日は、未完了／完了の枠を出しません。
     「他予定」だけの日に「すべて完了しています」と出るのを避けるためです */
  if (!list.length){
    const e = el('div', 'empty-msg');
    e.textContent = 'この日の作業はありません。';
    app.appendChild(e);
    app.appendChild(miscSection(other));
    return;
  }

  const cols = el('div', 'day-cols');

  /* 左：これから作業するもの */
  const left = el('div', 'col');
  if (undone.length){
    const hint = el('div', 'hint');
    hint.innerHTML = '<span class="lab">未完了 ' + undone.length + '件</span>'
      + '<span class="arrow">→→</span>'
      + '<span class="msg"><span class="p1">カードを右へスワイプすると、</span>'
      + '<span class="p2">タスクが完了へ移動します</span></span>';
    left.appendChild(hint);
    const wrap = el('div', 'tasks');
    undone.forEach(j => wrap.appendChild(taskEl(j)));
    left.appendChild(wrap);
  } else {
    const e = el('div', 'empty-msg');
    e.textContent = 'この日の作業はすべて完了しています。';
    left.appendChild(e);
  }
  cols.appendChild(left);

  /* 右：完了したもの */
  const right = el('div', 'col col-done');
  const lab = el('div', 'section-label');
  lab.textContent = '完了　' + done.length + '件';
  right.appendChild(lab);
  if (done.length){
    const wrap = el('div', 'tasks');
    done.forEach(j => wrap.appendChild(taskEl(j)));
    right.appendChild(wrap);
  } else {
    const e = el('div', 'empty-msg');
    e.textContent = 'まだありません。\n未完了のカードを右へスワイプすると\nここに移ります。';
    e.style.whiteSpace = 'pre-line';
    right.appendChild(e);
  }
  cols.appendChild(right);

  app.appendChild(cols);

  /* いちばん下にほかの業務。読むだけです */
  app.appendChild(miscSection(other));
}

/* いちばん下の「他予定」欄。
   PCでは未完了と同じ幅に収めます（右の完了枠まではみ出させない）。
   スマホは1列なのでそのまま幅いっぱいになります */
function miscSection(other){
  const box = el('div', 'day-cols');
  const col = el('div', 'col');
  if (other.length){
    const lab = el('div', 'section-label');
    lab.style.marginTop = '14px';
    lab.textContent = '他予定　' + other.length + '件';
    col.appendChild(lab);
    const wrap = el('div', 'tasks');
    other.forEach(m => wrap.appendChild(miscEl(m)));
    col.appendChild(wrap);
  }
  col.appendChild(miscButton());
  box.appendChild(col);
  return box;
}

/* ほかの業務を出す・隠すボタン。月表示でも日表示でも同じ設定を切り替えます */
function miscButton(){
  const wrap = el('div', '');
  wrap.style.cssText = 'display:flex; justify-content:center; margin-top:16px;';
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'misc-btn' + (MISC_ON ? ' on' : '');
  b.textContent = MISC_ON ? '他予定を隠す' : '他予定を表示';
  b.onclick = function(e){ e.stopPropagation(); setMiscOn(!MISC_ON); };
  wrap.appendChild(b);
  return wrap;
}

/* ほかの業務のカード。読むだけです */
function miscEl(m){
  const t = el('div', 'task misc');
  const card = el('div', 'task-card');
  card.innerHTML = '<div class="t-row1"><span class="t-name"></span></div>'
                 + '<div class="t-sub"></div>';
  card.querySelector('.t-name').innerHTML = '<span class="kind">他</span>';
  card.querySelector('.t-name').appendChild(document.createTextNode(m.name));
  card.querySelector('.t-sub').textContent = miscTime(m);
  t.appendChild(card);
  return t;
}

function taskEl(j){
  const t = el('div', 'task k-' + (j.kind || 'm') + (j.done ? ' done' : ''));
  t.dataset.row = j.row;
  t.dataset.id = j.id;

  const bg = el('div', 'task-bg');
  bg.innerHTML = '<span>✓ 完了</span>';
  t.appendChild(bg);

  const card = el('div', 'task-card');
  const left = j.due ? diff(TODAY, j.due) : null;
  /* 完了したものに「遅れ」は出しません。代わりに「何日前」を別の色で出します */
  const dueCls = j.done ? " ago"
    : (left === null ? "" : (left < 0 ? " over" : (left <= 2 ? " near" : "")));

  card.innerHTML =
    '<div class="t-row1"><span class="t-name"></span>' + (j.time ? '<span class="t-time"></span>' : '') + '</div>'
    + '<div class="t-sub"></div>'
    + '<div class="t-meta">'
    +   (j.due ? '<span class="due' + dueCls + '"></span>' : '')
    +   (j.label === false ? '<span class="nolabel">ラベル未発行</span>' : '')
    +   (j.qty ? '<span class="qty"></span>' : '')
    +   (j.boxes ? '<span class="boxes"></span>' : '')
    +   (j.code ? '<span class="code"></span>' : '')
    + '</div>'
    + '<div class="t-skus" hidden></div>'
    + '<div class="t-actions"><button type="button" class="act"></button></div>';

  card.querySelector('.t-name').innerHTML =
    /* バッジは漢字1文字に収めます（造・出・他） */
    '<span class="kind k-' + (j.kind || 'm') + '">' + (j.kind === 's' ? '出' : '造') + '</span>';
  card.querySelector('.t-name').appendChild(document.createTextNode(j.name));
  if (j.time) card.querySelector('.t-time').textContent = j.time;
  card.querySelector('.t-sub').textContent = [j.cust, j.to].filter(Boolean).join(' → ');
  if (j.due) card.querySelector('.due').textContent = j.done
    ? ('納品 ' + md(j.due) + '　' + agoText(j.start))
    : ('納品 ' + md(j.due) + '　'
       + (left < 0 ? Math.abs(left) + '日 遅れ' : (left === 0 ? '本日まで' : 'あと' + left + '日')));
  if (j.qty) card.querySelector('.qty').textContent = j.qty;
  if (j.boxes) card.querySelector('.boxes').textContent = j.boxes + '個口';
  if (j.code) card.querySelector('.code').textContent = j.code;

  /* 製造タスクだけ、在庫のSKU一覧と「作らない」チェックを出します */
  if (j.kind !== 's') buildSkus(card.querySelector('.t-skus'), j);

  const act = card.querySelector('.act');
  act.textContent = j.done ? '完了を取り消す' : '完了にする';
  act.onclick = e => { e.stopPropagation(); commit(j, !j.done); };

  t.appendChild(card);
  if (!j.done) enableSwipe(t, card, j);
  return t;
}

function el(tag, cls){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

/* ---------- 右スワイプで完了 ---------- */
function enableSwipe(task, card, j){
  let sx = 0, sy = 0, dx = 0, active = false, decided = false, horiz = false, pid = null;

  card.addEventListener('pointerdown', e => {
    if (e.button) return;
    if (e.target.closest('button')) return;
    active = true; decided = false; horiz = false;
    sx = e.clientX; sy = e.clientY; dx = 0; pid = e.pointerId;
    card.classList.remove('snap');
  });

  card.addEventListener('pointermove', e => {
    if (!active) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!decided){
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      decided = true;
      horiz = Math.abs(mx) > Math.abs(my);
      if (horiz){ try { card.setPointerCapture(pid); } catch(_){} }
    }
    if (!horiz) return;
    e.preventDefault();
    dx = Math.max(0, mx);
    card.style.transform = 'translateX(' + dx + 'px)';
  });

  function end(){
    if (!active) return;
    active = false;
    card.classList.add('snap');
    const threshold = Math.min(150, task.getBoundingClientRect().width * 0.4);
    if (horiz && dx >= threshold){
      card.style.transform = 'translateX(100%)';
      commit(j, true);
    } else {
      card.style.transform = 'translateX(0)';
    }
    dx = 0;
  }
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

/* ---------- 完了／取り消しを送信 ---------- */
/* ---------- 在庫：何をいくつ作るかの表示 ----------
   押せるチェックは置いていません。作る／作らないの判断は編集者側で決めるものなので、
   ここでは「何をいくつ」と「作らない指示が付いているか」だけを読めるようにしています */
function buildSkus(box, j){
  if (!box) return;
  const list = j.skus || [];
  box.innerHTML = "";
  box.hidden = false;

  if (!list.length){
    /* 在庫シートに行がまだ無い。朝と昼のGASで増えるので、そのうち出ます */
    const n = el('div', 'note');
    n.textContent = '在庫の行がまだ作られていません（自動で反映されます）';
    box.appendChild(n);
    return;
  }

  list.forEach(function(x){
    const row = el('div', 't-sku' + (x.skip ? ' off' : ''));
    row.innerHTML = '<div><span class="code"></span> <span class="nm"></span>'
                  + '<span class="qty"></span></div><span class="lab"></span>';

    row.querySelector('.code').textContent = x.sku || '（SKU未設定）';
    row.querySelector('.nm').textContent = x.name || '';
    const q = (x.rest !== null && x.rest !== undefined) ? x.rest : x.need;
    row.querySelector('.qty').textContent = (q === null || q === undefined) ? '' : ('残り' + q);
    row.querySelector('.lab').textContent = x.skip
      ? '在庫から消費 — 作らずに完了してください' : '';

    box.appendChild(row);
  });
}

function commit(j, done){
  const task = app.querySelector('.task[data-row="' + j.row + '"]');
  if (task) task.classList.add('busy');
  pending++;
  setState("保存中…", "busy");

  call("setDone", {row:j.row, kind:j.kind, done: done ? 1 : 0})
    .then(function(res){
      pending--;
      j.done = res.done;
      setState((res.stock ? res.stock : "最終更新 " + hm()), res.stock ? "busy" : "");
      render();
    })
    .catch(function(e){
      pending--;
      setState("保存できませんでした", "err");
      render();
      alert("保存できませんでした。通信を確認してもう一度お試しください。\n\n" + e.message);
    });
}

/* ---------- 自動更新 ---------- */
setInterval(function(){
  if (pending || document.hidden || !booted) return;
  load(true);
}, 60000);

start();
})();
</script>
