<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ラベル印刷補助</title>
<!-- タブのマーク（印刷マンと同じ、横長の送り状が2枚重なる）。ファイルを増やさないようページに直接書いている -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='11' y='5' width='50' height='35' rx='3' fill='%23ffffff' stroke='%231D2523' stroke-width='2.5'/%3E%3Cpath d='M36 7 L36 38 M13 22.5 L59 22.5' stroke='%23B9C3C0' stroke-width='1'/%3E%3Crect x='3' y='21' width='52' height='37' rx='3' fill='%23ffffff' stroke='%231D2523' stroke-width='2.5'/%3E%3Cpath d='M29 23 L29 56 M5 39.5 L53 39.5' stroke='%23B9C3C0' stroke-width='1'/%3E%3Crect x='6.5' y='24.5' width='2.2' height='11.5' fill='%231D2523'/%3E%3Crect x='10.1' y='24.5' width='1.2' height='11.5' fill='%231D2523'/%3E%3Crect x='12.7' y='24.5' width='2.2' height='11.5' fill='%231D2523'/%3E%3Crect x='16.3' y='24.5' width='1.2' height='11.5' fill='%231D2523'/%3E%3Crect x='18.9' y='24.5' width='2.2' height='11.5' fill='%231D2523'/%3E%3Crect x='32.5' y='25.5' width='18' height='2.6' rx='1' fill='%2348BFA6'/%3E%3Crect x='32.5' y='31' width='14' height='2.6' rx='1' fill='%2348BFA6'/%3E%3Crect x='32.5' y='44' width='17' height='2.6' rx='1' fill='%2348BFA6'/%3E%3Crect x='32.5' y='49.5' width='12' height='2.6' rx='1' fill='%2348BFA6'/%3E%3Crect x='6' y='42.5' width='20' height='12.5' rx='1.5' fill='%23F2C94C'/%3E%3C/svg%3E">
<style>
/* 出荷ボード・印刷マンと同じ色。いつもダークで表示します */
:root{
  color-scheme: dark;
  --ground:#0E1312; --surface:#161D1B; --surface-2:#1D2523;
  --line:#3E4C48; --line-strong:#647672; --ink:#E7EDEA; --muted:#DCE3DF;   /* 白の85%くらい。灰色だと黒地で読みにくい（出荷ボードの75%より一段明るく） */
  --accent:#48BFA6; --accent-ink:#08201C; --accent-soft:#11332C;
  --warn:#D9A445; --warn-soft:#30260F; --danger:#E4695C; --danger-soft:#391C19;
}
*{box-sizing:border-box}
[hidden]{display:none !important;}
html, body{height:100%;}
body{margin:0; background:var(--ground); color:var(--ink); display:flex; flex-direction:column;
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif; font-size:14px; line-height:1.5;}
header{padding:8px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--surface);}
header h1{font-size:17px; margin:0; white-space:nowrap;}
nav{display:flex; gap:6px; flex-wrap:wrap;}
nav button{font:inherit; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:6px 14px; cursor:pointer;}
nav button:hover{border-color:var(--accent);}
nav button[aria-selected="true"]{color:var(--accent-ink); background:var(--accent); border-color:var(--accent); font-weight:700;}
.drop{flex:1 1 220px; min-width:200px; border:2px dashed var(--line-strong); border-radius:7px; padding:5px 12px; color:var(--muted); font-size:12px; text-align:center;}
.drop.over{border-color:var(--accent); background:var(--accent-soft); color:var(--ink);}
.ver{font-size:13px; font-weight:700; color:var(--accent); border:1px solid var(--accent); border-radius:5px; padding:0 8px;}
#msg{font-size:12px; padding:4px 16px; background:var(--warn-soft); color:var(--warn);}
.frames{flex:1; position:relative; min-height:0;}
.frames iframe{position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--ground);}
</style>
</head>
<body>
<header>
  <h1>ラベル印刷補助</h1>
  <nav role="tablist">
    <button role="tab" data-tab="label">印刷マン</button>
    <button role="tab" data-tab="hinmei">送り状 余白書き換え</button>
    <button role="tab" data-tab="tracking">追跡番号出力</button>
  </nav>
  <div class="drop" id="drop">ここにファイルを落とすと、合うタブで開きます（別紙→印刷マン／送り状PDF→余白書き換え／発行済データ→追跡番号出力）</div>
  <!-- 版番号。push するたびに上げます（中の3つのページとは別に数えます） -->
  <span class="ver">v5</span>
</header>
<div id="msg" hidden></div>
<div class="frames" id="frames"></div>

<script>
/* ===================================================================
   ラベル印刷補助  v5

   印刷マン（label/）・送り状 余白書き換え（hinmei/）・追跡番号出力（tracking/）を1つの入口にまとめる。
   ・中の3つは今のページをそのまま枠（iframe）で出す。開いたタブだけ読み込み、切り替えても中身は残る
   ・上の帯にファイルを落とすと、中身を見て合うタブへ渡す
       PDF → 余白書き換え ／ 見出しに「伝票番号」「お届け先名」がある表 → 追跡番号出力 ／ それ以外の表 → 印刷マン
   ・前に開いていたタブを覚える。URLの #label #hinmei #tracking でも開ける
   ・今の3つのURLはそのまま残す（ほかの人のブックマーク用）
   ・ops（bishop-ops）の左メニューから開いたときは、ops の設定「送り状の依頼主」を受け取り、
     印刷マンの依頼主に入れる（v4）。前に ops から受け取った1件だけを直し、無ければ足す。
     本社と倉庫のように名前・電話が同じで住所違いの依頼主もあるので、手で入れた依頼主には触らない。今選んでいる依頼主も変えない
   =================================================================== */
(function () {
'use strict';

const PAGES = {label: '../label/', hinmei: '../hinmei/', tracking: '../tracking/'};
const NAMES = {label: '印刷マン', hinmei: '送り状 余白書き換え', tracking: '追跡番号出力'};
const LS_TAB = 'print_tab_v1';
const $ = s => document.querySelector(s);
const frames = {};

function frameOf(tab) {
  if (!frames[tab]) {
    const f = document.createElement('iframe');
    f.src = PAGES[tab];
    f.title = NAMES[tab];
    f.loaded = new Promise(ok => f.addEventListener('load', ok, {once: true}));
    $('#frames').appendChild(f);
    frames[tab] = f;
  }
  return frames[tab];
}

function show(tab) {
  if (!PAGES[tab]) tab = 'label';
  frameOf(tab);
  Object.keys(frames).forEach(k => { frames[k].hidden = k !== tab; });
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  document.title = NAMES[tab] + '｜ラベル印刷補助';
  try { localStorage.setItem(LS_TAB, tab); } catch (e) { /* 覚えられなくても動く */ }
  if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
}

function msg(text) {
  $('#msg').textContent = text;
  $('#msg').hidden = !text;
}

/* ファイルの中身から、どのタブで開くかを決める */
async function tabFor(file) {
  const head = new Uint8Array(await file.slice(0, 4096).arrayBuffer());
  if (head[0] === 0x25 && head[1] === 0x50 && head[2] === 0x44 && head[3] === 0x46) return 'hinmei';   // %PDF
  if (head[0] === 0x50 && head[1] === 0x4B) return 'label';                                            // xlsx（zip）は別紙
  let text;
  try { text = new TextDecoder('utf-8', {fatal: true}).decode(head); }
  catch (e) { text = new TextDecoder('shift_jis').decode(head); }
  const top = text.split(/\r?\n/).slice(0, 3).join('\n');
  return /伝票番号/.test(top) && /お届け先名/.test(top) ? 'tracking' : 'label';
}

/* 中のページのドロップ欄に、落としたのと同じようにファイルを渡す */
async function handOver(file) {
  msg('');
  let tab;
  try { tab = await tabFor(file); } catch (e) { msg('ファイルを読めませんでした：' + (e.message || e)); return; }
  show(tab);
  const f = frameOf(tab);
  await f.loaded;
  const W = f.contentWindow, target = W.document.getElementById('drop');
  if (!target) { msg(NAMES[tab] + 'のページにファイルを渡せませんでした。中のページに直接落としてください'); return; }
  const dt = new W.DataTransfer();
  dt.items.add(file);
  target.dispatchEvent(new W.DragEvent('drop', {dataTransfer: dt, bubbles: true, cancelable: true}));
}

const drop = $('#drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handOver(f); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f && e.target !== drop) handOver(f); });
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
window.addEventListener('hashchange', () => show(location.hash.slice(1)));

/* ---- ops から依頼主を受け取る（v4） ----
   ops は {type:'bishop-ops:shipper', version:1, shipper:{name, postal, address1, address2, phone}} を送ってくる。
   ops のURLは公開リポに書かないので、送り元（origin）は SHA-256 の値で見比べる。開いた窓（opener）からの分だけ受け取る */
const OPS_ORIGIN_SHA256 = '4a70d412f2994ee31ad4a4828f832a6564db66d7f6d795086f894028d58b70e5';
const LS_SENDERS = 'label.senders.v1', LS_SENDER_SEL = 'label.sender.sel.v1';   // 印刷マン（label/app.js）と同じ置き場所

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
const digits = v => String(v || '').replace(/[^0-9]/g, '');

/* 印刷マンの依頼主に入れる。中身が変わったら true */
function putShipper(sh) {
  const s = {
    name: String(sh.name || '').trim(),
    tel: String(sh.phone || '').trim(),
    zip: String(sh.postal || '').trim(),
    addr: String(sh.address1 || '').trim(),
    bldg: String(sh.address2 || '').trim()
  };
  const code = String(sh.code || '').trim();   // 今の ops は送ってこない。送ってくるようになったら使う
  if (!s.name || !s.addr) return false;
  let list;
  try { list = JSON.parse(localStorage.getItem(LS_SENDERS) || '[]') || []; } catch (e) { list = []; }
  /* 同じ名前・電話でも本社と倉庫のように住所違いがあるので、名前と電話だけでは同じとみなさない。
     住所は書き方の違い（5丁目37-4 と 5-37-4、住所と建物名の分け方、全角半角、空白）を吸収して見比べる。
     前に ops から受け取った1件（src:'ops'）だけを ops に合わせて直し、ほかの依頼主には触らない */
  const addrKey = x => String((x.addr || '') + (x.bldg || '')).normalize('NFKC')
    .replace(/\s+/g, '').replace(/[‐－―ー−]/g, '-')
    .replace(/(\d+)丁目/g, '$1-').replace(/(\d+)番地?/g, '$1-').replace(/(\d+)号(?!館|棟|室|倉庫)/g, '$1').replace(/-+/g, '-');
  const same = x => x && x.name === s.name && digits(x.tel) === digits(s.tel) && digits(x.zip) === digits(s.zip) &&
                    addrKey(x) === addrKey(s);
  const fromOps = list.find(x => x && x.src === 'ops');
  const manual = list.find(x => x && x !== fromOps && x.src !== 'ops' && (code ? x.code === code : same(x)));
  if (fromOps && manual) {
    /* 書き方の違いで別の依頼主として足してしまった分（v4 の初め）を片づける。手で入れた方（コード付き）を残す */
    list = list.filter(x => x !== fromOps);
    manual.src = 'ops';
    try { if (JSON.parse(localStorage.getItem(LS_SENDER_SEL) || '""') === fromOps.id) localStorage.setItem(LS_SENDER_SEL, JSON.stringify(manual.id)); } catch (e) { /* 選び直してもらう */ }
    localStorage.setItem(LS_SENDERS, JSON.stringify(list));
    return true;
  }
  if (fromOps) {
    if (same(fromOps)) return false;
    Object.assign(fromOps, s);                // 依頼主コードは ops から来なければ、今のものを残す
    if (code) fromOps.code = code;
  } else if (manual) {
    manual.src = 'ops';                       // 手で入れた同じ依頼主があれば、それを ops の分とする（中身は手で入れたまま）
    localStorage.setItem(LS_SENDERS, JSON.stringify(list));
    return false;
  } else {
    s.src = 'ops';
    s.code = code;
    s.id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    list.push(s);
    try { if (!localStorage.getItem(LS_SENDER_SEL)) localStorage.setItem(LS_SENDER_SEL, JSON.stringify(s.id)); } catch (e) { /* 下で知らせる */ }
  }
  localStorage.setItem(LS_SENDERS, JSON.stringify(list));
  return true;
}

window.addEventListener('message', async e => {
  const d = e.data;
  if (!d || d.type !== 'bishop-ops:shipper' || d.version !== 1 || !d.shipper) return;
  if (!window.opener || e.source !== window.opener) return;
  if (await sha256(e.origin) !== OPS_ORIGIN_SHA256) return;
  let changed;
  try { changed = putShipper(d.shipper); }
  catch (err) { msg('ops から依頼主を受け取れませんでした（ブラウザに保存できません）：' + (err.message || err)); return; }
  if (!changed) return;
  msg('ops から依頼主「' + d.shipper.name + '」を受け取り、印刷マンの依頼主に入れました');
  if (frames.label) frames.label.contentWindow.location.reload();   // 開いている印刷マンに読み直させる
});
/* 受け取る用意ができたことを ops に知らせる（中身の無い合図なので、送り先は決めない） */
if (window.opener) { try { window.opener.postMessage({type: 'bishop-ops:ready'}, '*'); } catch (e) { /* ops 以外から開いたとき */ } }

let first = location.hash.slice(1);
if (!PAGES[first]) { try { first = localStorage.getItem(LS_TAB) || 'label'; } catch (e) { first = 'label'; } }
show(first);

// 確かめる用（画面の動きには関係しない）
window.PRINT = {show: show, handOver: handOver, tabFor: tabFor, frames: frames, putShipper: putShipper, sha256: sha256};
})();
</script>
</body>
</html>
